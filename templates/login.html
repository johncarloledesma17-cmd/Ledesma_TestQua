<!DOCTYPE html>
<html>
<head>
    <title>Login - TestQua</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/w3.css') }}">
</head>
<body class="w3-light-grey w3-mobile">

    <div class="w3-container w3-padding-32">
        <!-- Consistent Card Design -->
        <div class="w3-card-4 w3-white w3-round-large w3-margin" style="max-width:450px; margin: 0 auto !important; overflow: hidden;">
            
            <!-- Consistent Header Color (Indigo) -->
            <div class="w3-container w3-green w3-padding-16">
                <h2 class="w3-margin-0"><b>WELCOME BACK</b></h2>
                <p class="w3-margin-0 w3-small">Sign in to your personal space.</p>
            </div>
            
            <div class="w3-container w3-padding-24">
                <!-- Display Error Messages here -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="w3-panel w3-pale-red w3-leftbar w3-border-red w3-padding w3-round">
                          <p class="w3-margin-0">{{ message }}</p>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST">
                    <p>
                        <label class="w3-text-grey"><b>Email</b></label>
                        <input type="email" name="email" class="w3-input w3-border w3-round" required>
                    </p>
                    <p>
                        <label class="w3-text-grey"><b>Password</b></label>
                        <input type="password" name="password" class="w3-input w3-border w3-round" required>
                    </p>
                    
                    <!-- Consistent Button Color (Teal) -->
                    <button type="submit" class="w3-button w3-teal w3-block w3-round w3-margin-top w3-padding">Login</button>
                </form>
                
                <p class="w3-center w3-margin-top w3-small">
                    New here? <a href="/register" class="w3-text-indigo"><b>Create an account</b></a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
